<!--
  PLACEHOLDER — not the Aiuby logo.

  The previous file drew the letters "ECC" and shipped as the plugin icon, so
  the upstream project's mark was being distributed under an Aiuby filename.
  This replaces it with a deliberately neutral glyph: no letterform, no brand
  colour, nothing that decides what Aiuby looks like.

  Replace with the official mark. Consumers: .codex-plugin/plugin.json
  (composerIcon), plugins/aiuby/.codex-plugin/plugin.json, and the control pane.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Aiuby</title>
  <rect width="128" height="128" rx="28" fill="#111827"/>
  <circle cx="64" cy="64" r="26" fill="none" stroke="#E5E7EB" stroke-width="8"/>
  <circle cx="64" cy="64" r="7" fill="#E5E7EB"/>
</svg>
